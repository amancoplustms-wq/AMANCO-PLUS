<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <!-- شعار أمانكو بلس للشحن والتوريد (أيقونة الدرع) -->
  <defs>
    <linearGradient id="shieldGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="18" y1="28" x2="46" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <filter id="shieldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- الدرع الخارجي (رمز الأمان اللوجستي) -->
  <path
    d="M32 4L8 16V30C8 44.36 18.28 57.52 32 60C45.72 57.52 56 44.36 56 30V16L32 4Z"
    fill="#0f172a"
    stroke="#334155"
    stroke-width="1.5"
    filter="url(#shieldShadow)"
  />

  <!-- التدرج اللوني الداخلي للدرع -->
  <path
    d="M32 7L11 17.5V30C11 42.8 20.2 54.6 32 57C43.8 54.6 53 42.8 53 30V17.5L32 7Z"
    fill="url(#shieldGrad)"
    stroke="#475569"
    stroke-width="0.5"
  />

  <!-- صندوق الطرد والتوريد اللوجستي -->
  <rect
    x="21"
    y="22"
    width="16"
    height="14"
    rx="2"
    fill="url(#arrowGrad)"
  />
  <line x1="29" y1="22" x2="29" y2="36" stroke="#0f172a" stroke-width="1.2" />
  <line x1="21" y1="29" x2="37" y2="29" stroke="#0f172a" stroke-width="1.2" />

  <!-- سهم السرعة والانتشار الفوري -->
  <path
    d="M38 32L50 26L46 31H50L38 38L42 33H38V32Z"
    fill="#f97316"
    stroke="#fdba74"
    stroke-width="0.5"
    stroke-linejoin="round"
  />

  <!-- علامة الصح الخضراء (ضمان سلامة التسليم والتوريد) -->
  <path
    d="M25 43L29 47L39 37"
    stroke="#059669"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
