<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="680" height="160" fill="none">
  <!-- شعار أمانكو بلس للشحن والتوريد (النمط الداكن الرسمي) -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&amp;display=swap');
      .cairo-main {
        font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
        font-weight: 900;
        font-size: 64px;
        line-height: 1;
      }
      .cairo-sub {
        font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
        font-weight: 700;
        font-size: 23px;
        line-height: 1;
      }
    </style>
    <linearGradient id="shieldGradDark" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="arrowGradDark" x1="18" y1="28" x2="46" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
  </defs>

  <!-- الخلفية الكحلية الداكنة الفخمة -->
  <rect width="680" height="160" rx="16" fill="#0f172a" />

  <!-- أيقونة الدرع (على اليمين في الاتجاه العربي) -->
  <g transform="translate(530, 20) scale(1.875)">
    <path d="M32 4L8 16V30C8 44.36 18.28 57.52 32 60C45.72 57.52 56 44.36 56 30V16L32 4Z"
          fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <path d="M32 7L11 17.5V30C11 42.8 20.2 54.6 32 57C43.8 54.6 53 42.8 53 30V17.5L32 7Z"
          fill="url(#shieldGradDark)" />
    <rect x="21" y="22" width="16" height="14" rx="2" fill="url(#arrowGradDark)" />
    <line x1="29" y1="22" x2="29" y2="36" stroke="#0f172a" stroke-width="1.2" />
    <line x1="21" y1="29" x2="37" y2="29" stroke="#0f172a" stroke-width="1.2" />
    <path d="M38 32L50 26L46 31H50L38 38L42 33H38V32Z"
          fill="#f97316" stroke="#fdba74" stroke-width="0.5" stroke-linejoin="round" />
    <path d="M25 43L29 47L39 37" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- السطر الأول: أمانكو بلس -->
  <text x="500" y="78" text-anchor="end" class="cairo-main">
    <tspan fill="#ffffff">أمانكو </tspan>
    <tspan fill="#f97316">بلس</tspan>
  </text>

  <!-- السطر الثاني: AMANCO PLUS • للشحن والتوريد -->
  <text x="500" y="125" text-anchor="end" class="cairo-sub">
    <tspan fill="#e2e8f0" letter-spacing="1">AMANCO </tspan>
    <tspan fill="#f97316">PLUS </tspan>
    <tspan fill="#64748b">• </tspan>
    <tspan fill="#94a3b8">للشحن والتوريد</tspan>
  </text>
</svg>
